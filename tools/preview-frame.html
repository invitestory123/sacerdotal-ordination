<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile preview harness (dev only)</title>
<style>
  html, body { margin: 0; background: #1c1c20; height: 100%; }
  body { display: flex; align-items: flex-start; justify-content: center; }
  iframe { border: 0; background: #fff; display: block; }
</style>
</head>
<body>
  <!-- Renders the invitation at a true mobile width for screenshots/QA.
       Usage: tools/preview-frame.html[?q=open][?h=2000]#section-id
       q is forwarded to index.html, h sets the frame height (default 844). -->
  <iframe id="frame" title="Invitation preview"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const q = params.get('q');
    const h = params.get('h') || 844;
    const frame = document.getElementById('frame');
    frame.style.width = '390px';
    frame.style.height = h + 'px';
    frame.src = '../index.html' + (q ? '?' + q : '') + location.hash;
  </script>
</body>
</html>
